name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Byte-compile (catches syntax errors on older Pythons)
        run: python -m compileall -q agent_collab tests
      - name: Test
        run: python -m pytest -q
        env:
          # Tests never call real LLMs or search engines; make sure nothing leaks in.
          ANTHROPIC_API_KEY: ""
          AGENT_COLLAB_SEARCH: "off"
