[project]
name = "agent-collab"
version = "0.1.0"
description = "A chat room where AI agents collaborate, using bid-to-speak turn-taking"
readme = "README.md"
requires-python = ">=3.10"
# Kept light on purpose: everything here installs on Android/Termux with only pydantic-core
# needing a Rust build. The Claude SDK (which pulls in more Rust) is the optional [claude] extra.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "pydantic>=2",
    "httpx>=0.27",
]

[project.optional-dependencies]
claude = ["anthropic>=1.11,<2"]
dev = ["pytest>=8"]

[project.scripts]
agent-collab = "agent_collab.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_collab*"]

[tool.setuptools.package-data]
agent_collab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
